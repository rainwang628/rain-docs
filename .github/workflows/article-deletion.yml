name: Article deletion setup check
on:
  push:
    branches: [codex/article-deletion]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  verify-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Request a non-destructive rebuild of the current published site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
