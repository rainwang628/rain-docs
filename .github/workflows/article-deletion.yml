name: Story workflow write check
on:
  push:
    branches: [codex/article-deletion]
permissions:
  contents: write
jobs:
  verify-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify write access on the development branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Verify development-branch write access"
          git push origin HEAD:refs/heads/codex/article-deletion
