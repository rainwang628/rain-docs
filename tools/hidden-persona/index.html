const types={
  '110':{name:'温柔掌控者',immortal:'何仙姑',artifact:'荷花',seal:'莲',epithet:'莲心有尺',immortalInk:'#bc7773',immortalRobe:'#e3a9a5',immortalLore:'取荷花的清澈与自守，写出你温和外表下的独立判断。',immortalWhy:'你可以照顾场面，也可以在重要时刻守住自己的决定。',subtitle:'外表很柔软，心里却有一套自己的秩序',quote:'你看起来很好说话，其实很难被真正拿捏。',intro:'你擅长把锋芒藏进体贴里。别人看到的是你的平和与配合，而你心里对事情的轻重缓急一直很清楚。真正重要的节点，你会悄悄握住方向盘。',gap:'你的反差不在于突然强势，而在于安静地做决定。你很少证明自己有多厉害，却通常已经为变化准备好了第二套方案。',strengths:[['温柔有力量','不必提高音量，也能让人愿意配合'],['稳稳的节奏感','复杂局面里依然能把事情理顺'],['选择性坚持','只在真正重要的地方表达坚定']],relation:'在关系中，你愿意照顾对方的感受，也希望自己的意见得到认真对待。你喜欢一起解决问题，而不是反复争输赢。',blind:'你可能习惯一边照顾气氛，一边承担更多决策，久了反而容易疲惫。',advice:['把一些决定还给别人，不必每次都做兜底的人。','直接表达自己的需要，不用总等别人来猜。','你的温柔不必通过牺牲自己的节奏来证明。'],lines:['柔软是你的天赋，清醒是你的底气。','看似没有锋芒，其实自有方向。','你不必控制一切，也能稳稳向前。']},
  '111':{name:'笑面反骨派',immortal:'张果老',artifact:'渔鼓',seal:'鼓',epithet:'反着走也坦荡',immortalInk:'#b97b53',immortalRobe:'#d7b47c',immortalLore:'借倒骑驴的民间故事，表达不循常规、却自有一套章法的幽默。',immortalWhy:'你待人热情，却会在关键原则上显出意想不到的坚持。',subtitle:'人前幽默随和，骨子里却自带一股不服输',quote:'看着挺好商量，真正的原则从不打折。',intro:'你很会照顾场面，也能迅速察觉别人情绪。但在那些看似很好商量的时刻，你的内心也会悄悄亮起自己的主张。',gap:'别人以为你总是好脾气，直到触及你真正相信的东西，才发现你那股不服输的劲儿。你的反差来自热情和坚持同时在线。',strengths:[['带动氛围','很容易让沉默的场合活起来'],['热烈的行动力','有感觉时就会想办法去实现'],['真实的勇气','能表达喜欢，也敢表达不赞同']],relation:'你希望彼此坦诚又好玩，不喜欢表面和气、心里却不说。你可能在意回应的温度，也珍惜对方尊重你选择的空间。',blind:'你有时会为了照顾关系先答应，之后又对被安排感到不舒服。',advice:['说“不”不等于破坏关系。','情绪来得快时，给自己一点判断时间。','真正适合你的人，会喜欢你的活泼也尊重你的原则。'],lines:['随和是我的表象，主见是我的底气。','热烈生活，不代表可以被随意定义。','我会温柔，但不会丢掉自己。']},
  '101':{name:'热闹共情家',immortal:'汉钟离',artifact:'芭蕉扇',seal:'扇',epithet:'笑里有暖风',immortalInk:'#b17a63',immortalRobe:'#e4b98b',immortalLore:'以扇子的舒展和宽厚形象，比喻善于接住他人情绪的你。',immortalWhy:'热闹时你能让大家安心，独处时也需要照顾自己的感受。',subtitle:'人群里的小太阳，独处时也会悄悄多想',quote:'大家以为我负责开心，其实我也会收藏心事。',intro:'你总能迅速接住别人的话和情绪，是聚会里的温度担当。但热闹过去后，一些细小的瞬间仍会留在你心里。',gap:'你的反差是在人群中大大方方，回到自己的世界却格外敏感。你并非没心没肺，只是更愿意先让别人快乐。',strengths:[['共情雷达','很快感受到场上谁需要照顾'],['自然的亲和力','让陌生人也更容易放松'],['连接能力','愿意为关系创造共同回忆']],relation:'你喜欢有回应的关系，容易被细节打动。你也可能在别人没有及时回复时多想，需要学会允许不同的表达节奏。',blind:'热闹里经常照顾所有人，却容易把自己的疲惫藏起来。',advice:['偶尔让别人来照顾你的情绪。','不用每段沉默都靠你填满。','你的价值不只在于能让大家开心。'],lines:['热闹是你的光，细腻是你的影。','笑得最大声的人，也值得被认真听见。','喜欢世界，也别忘了抱抱自己。']},

const PERSONA_ACCESS_STORAGE='paradox-lab-purchased-access-v1';
const PERSONA_ACCESS_URL='https://ucautsubldfvxoraeajb.supabase.co/functions/v1/persona-access';

const CODE_RE=/^[0-9a-f]{48}$/;
function randomSecret(){
 const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);
 return Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('');
}
function loadStoredAccess(){
 try{
  const o=JSON.parse(localStorage.getItem(PERSONA_ACCESS_STORAGE)||'null');
  if(o && CODE_RE.test(o.code) && CODE_RE.test(o.device))return o;
 }catch{}
 return null;
}
function rememberAccess(code,device){
 try{localStorage.setItem(PERSONA_ACCESS_STORAGE,JSON.stringify({code,device}));}catch{}
}
function stripCodeFromUrl(){
 // Fragment 避免兑换码进入服务器请求和通常的访问日志，验证时马上从地址栏移除。
 if(location.hash && location.hash.includes('code=')){
  history.replaceState(null,'',location.pathname+location.search);
 }
}
async function accessRequest(action){
 const response=await fetch(PERSONA_ACCESS_URL,{
  method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({action,code:accessCode,device:accessDevice}),
  cache:'no-store'
 });
 let payload;try{payload=await response.json();}catch{throw Error('校验服务返回异常，请稍后重试');}
 if(payload.ok && payload.active)return {active:true};
 if(payload.ok && payload.needs_activation)return {needs_activation:true};
 if(payload.error==='already_activated_elsewhere')throw Error('这个体验码已绑定其他浏览器。如需换手机，请联系卖家重置。');
 if(payload.error==='invalid_code')throw Error('体验码无效或已停用，请核对购买链接。');
 throw Error('验证暂时失败，请稍后重试。');
}

}
