const types={
  '110':{name:'温柔掌控者',subtitle:'外表很柔软，心里却有一套自己的秩序',quote:'你看起来很好说话，其实很难被真正拿捏。',intro:'你擅长把锋芒藏进体贴里。别人看到的是你的平和与配合，而你心里对事情的轻重缓急一直很清楚。真正重要的节点，你会悄悄握住方向盘。',gap:'你的反差不在于突然强势，而在于安静地做决定。你很少证明自己有多厉害，却通常已经为变化准备好了第二套方案。',strengths:[['温柔有力量','不必提高音量，也能让人愿意配合'],['稳稳的节奏感','复杂局面里依然能把事情理顺'],['选择性坚持','只在真正重要的地方表达坚定']],relation:'在关系中，你愿意照顾对方的感受，也希望自己的意见得到认真对待。你喜欢一起解决问题，而不是反复争输赢。',blind:'你可能习惯一边照顾气氛，一边承担更多决策，久了反而容易疲惫。',advice:['把一些决定还给别人，不必每次都做兜底的人。','直接表达自己的需要，不用总等别人来猜。','你的温柔不必通过牺牲自己的节奏来证明。'],lines:['柔软是你的天赋，清醒是你的底气。','看似没有锋芒，其实自有方向。','你不必控制一切，也能稳稳向前。']},
  '111':{name:'笑面反骨派',subtitle:'人前热情可爱，骨子里却有自己的火花',quote:'别看我笑得甜，该坚持的我一点也不含糊。',intro:'你很会照顾场面，也能迅速察觉别人情绪。但在那些看似很好商量的时刻，你的内心也会悄悄亮起自己的主张。',gap:'别人以为你总是好脾气，直到触及你真正相信的东西，才发现你那股不服输的劲儿。你的反差来自热情和坚持同时在线。',strengths:[['带动氛围','很容易让沉默的场合活起来'],['热烈的行动力','有感觉时就会想办法去实现'],['真实的勇气','能表达喜欢，也敢表达不赞同']],relation:'你希望彼此坦诚又好玩，不喜欢表面和气、心里却不说。你可能在意回应的温度，也珍惜对方尊重你选择的空间。',blind:'你有时会为了照顾关系先答应，之后又对被安排感到不舒服。',advice:['说“不”不等于破坏关系。','情绪来得快时，给自己一点判断时间。','真正适合你的人，会喜欢你的活泼也尊重你的原则。'],lines:['甜是我的外衣，倔是我的底气。','热烈生活，不代表可以被随意定义。','我会温柔，但不会丢掉自己。']},
  '101':{name:'热闹共情家',subtitle:'人群里的小太阳，独处时也会悄悄多想',quote:'大家以为我负责开心，其实我也会收藏心事。',intro:'你总能迅速接住别人的话和情绪，是聚会里的温度担当。但热闹过去后，一些细小的瞬间仍会留在你心里。',gap:'你的反差是在人群中大大方方，回到自己的世界却格外敏感。你并非没心没肺，只是更愿意先让别人快乐。',strengths:[['共情雷达','很快感受到场上谁需要照顾'],['自然的亲和力','让陌生人也更容易放松'],['连接能力','愿意为关系创造共同回忆']],relation:'你喜欢有回应的关系，容易被细节打动。你也可能在别人没有及时回复时多想，需要学会允许不同的表达节奏。',blind:'热闹里经常照顾所有人，却容易把自己的疲惫藏起来。',advice:['偶尔让别人来照顾你的情绪。','不用每段沉默都靠你填满。','你的价值不只在于能让大家开心。'],lines:['热闹是你的光，细腻是你的影。','笑得最大声的人，也值得被认真听见。','喜欢世界，也别忘了抱抱自己。']},
  '100':{name:'热闹疏离者',subtitle:'聊天可以很热情，心里始终有一块自由领地',quote:'我可以和所有人聊得来，但不必和所有人走得近。',intro:'你知道如何在社交场合保持轻松，也通常不被小事反复消耗。看起来朋友很多，但真正进入你内心的人可能并不多。',gap:'别人觉得你是随叫随到的气氛组，实际上你很擅长把社交与自己的生活分开。热情对你而言，是一种能力，不一定是承诺。',strengths:[['社交松弛感','能迅速找到舒适的互动方式'],['情绪复位快','小插曲通常不会占据你太久'],['轻盈的边界','喜欢热闹，也能享受一个人']],relation:'你偏爱不黏不绑的相处方式。比起不断确认关系，你更看重互相理解和各自精彩。',blind:'当你已经翻篇，对方可能还在等待一句明确的回应。',advice:['重要关系里，偶尔主动解释你的节奏。','给在乎的人一些被需要的确定感。','别用“我无所谓”省略真正想表达的东西。'],lines:['我很热情，但我也很自由。','不冷漠，只是不把每一刻都交出去。','轻松相处，是我的高级浪漫。']},
  '010':{name:'冷面谋略家',subtitle:'话不多、判断快，喜欢把底牌留到最后',quote:'沉默不是没想法，是我已经推演了三个版本。',intro:'你不太习惯第一时间展示态度，而是先把信息看清楚。别人可能以为你距离感强，但你只是习惯在充分判断后再行动。',gap:'你最大的反差是外表平静、内部高速运转。到了关键时刻，你可能比很多看起来强势的人更敢拍板。',strengths:[['清醒判断','面对噪声更愿意寻找关键事实'],['规划能力','习惯提前想好几种可能'],['克制表达','不轻易被场面带偏']],relation:'你对亲近的人往往是行动派。你不一定说很多甜言蜜语，却喜欢把实际问题处理好。',blind:'你可能太早进入解决问题模式，忘记对方首先需要被理解。',advice:['不是每个问题都需要马上得到答案。','让别人知道你在乎，偶尔直接说出来。','留一点空间给不按计划发生的惊喜。'],lines:['我的温度藏在行动里。','真正的底气，是不必急着亮底牌。','平静表面下，也有一整片星图。']},
  '011':{name:'安静燃烧者',subtitle:'表面没什么波澜，心里却有一团认真生活的火',quote:'我不一定说出口，但我比想象中更在意。',intro:'你看起来慢热、克制，甚至让人觉得不太好接近。只有真正熟悉你的人才会发现，你对喜欢的人与事投入得很深。',gap:'你的反差来自情绪与行动的不同节奏：心里翻山越岭，脸上却风平浪静；做出决定以后，又有惊人的执行力。',strengths:[['深度投入','愿意为热爱的事长期坚持'],['细节感知','容易留意别人忽略的微小变化'],['关键时刻可靠','不爱夸口，但倾向把事情做到']],relation:'你更相信慢慢建立的信任。过于频繁的试探会让你疲惫，稳定而真诚的交流更能打动你。',blind:'你把很多在意藏得太深，别人可能误以为你不需要回应。',advice:['重要感受可以不用等到“合适时机”再说。','偶尔让热情被看见，而不是只让结果说话。','允许自己有不必完美的尝试。'],lines:['安静不是熄灭，而是蓄光。','没说出口的认真，也值得被听见。','我的火焰，不需要喧哗。']},
  '001':{name:'冷感共情者',subtitle:'表面像一阵清风，心里却能感受很多细节',quote:'我不是不在乎，只是不习惯把在乎说得很响。',intro:'你给人的第一印象可能偏淡、偏理性，但实际上你很容易感受到关系中的微妙变化。很多事你都记得，只是不一定当场表达。',gap:'别人以为你无所谓，你却可能在回家路上重新想起一句话。比起立刻拥抱整个世界，你更习惯认真守护少数重要的人。',strengths:[['细腻洞察','能看见情绪背后的细节'],['安静陪伴','尊重别人的空间和节奏'],['真诚连接','不追求热闹，但珍惜深交']],relation:'你对熟人比对陌生人热情得多。你希望被理解，也需要安全感来打开内心。',blind:'你可能太习惯等别人先靠近，错过一些值得开始的关系。',advice:['可以从一句简单的表达开始，不必一次说完所有心事。','把别人的情绪和自己的责任分开。','允许自己被照顾，而不只是理解别人。'],lines:['外表淡淡的，心里却开着一片花。','慢一点靠近，也可以很真诚。','你的细腻，不需要被所有人看懂。']},
  '000':{name:'慢热自由派',subtitle:'不抢镜、不勉强，喜欢按自己的节奏生活',quote:'我不是没有故事，只是不急着交代给所有人。',intro:'你并不追求成为每个场合的中心，也不太希望被外界期待推着走。熟悉的人知道，你有一种稳稳的个人节奏。',gap:'别人眼里的你可能低调甚至有点佛系，但在真正珍惜的事情上，你会表现出安静的韧性。',strengths:[['内在稳定','不容易被集体情绪反复拉扯'],['自在独处','懂得给自己的生活留白'],['不盲从','更愿意自己感受、自己判断']],relation:'你喜欢舒服、松弛、互不消耗的相处。需要时愿意在场，但也珍惜独处的权利。',blind:'“顺其自然”有时会变成不主动，想争取的东西可能因此擦肩而过。',advice:['对真正重要的事，偶尔主动迈一步。','不擅长表达也没关系，但别一直让别人猜。','自在不是逃避，你可以温柔而坚定地选择。'],lines:['我有自己的速度，也有自己的方向。','不争一时喧哗，独享四季晴朗。','慢热，是我的认真筛选。']}
};
